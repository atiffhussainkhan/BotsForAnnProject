services:
  araim-cloud:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      ARAIM_LOCAL_CONTAINER: "true"
      ARAIM_OWNER_PASSWORD: ${ARAIM_OWNER_PASSWORD:?Set a private owner password of at least 20 characters}
      TIKTOK_WRITE_ENABLED: "false"
      INSTAGRAM_WRITE_ENABLED: "false"
      THIRD_PARTY_AUTOCOMMENT: "false"
    volumes:
      - araim_data:/app/data
    security_opt:
      - no-new-privileges:true

volumes:
  araim_data:
